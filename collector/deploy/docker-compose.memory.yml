# Loza Collector — memory eventbus (default, for local dev/testing)
# Usage: docker compose -f docker-compose.memory.yml up
services:
  collector:
    build:
      context: ../..
      dockerfile: collector/deploy/Dockerfile.collector
    command: ["./loza-collector", "run", "-c", "/app/configs/loza.local.yaml"]
    ports:
      - "9308:9308"
    volumes:
      - ../:/app
    environment:
      LOZA_EVENTBUS: memory
      COLLECTOR_RELIABILITY_MODE: direct
      LOZA_STORAGE_ENCRYPTION_KEY: dev-only-not-for-production

  sample-app:
    image: curlimages/curl:8.12.1
    depends_on:
      - collector
    volumes:
      - ../deploy:/payload
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 3
        curl -sS -X POST http://collector:9308/events \
          --data-binary @/payload/sample-events.ndjson \
          -H "Content-Type: application/x-ndjson"
