name: Publish GitHub Release

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      version:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    if: inputs.component == 'loza'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - run: python -m pip install pyyaml

      - name: Validate workflow inputs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMPONENT: ${{ inputs.component }}
        run: python scripts/release/validate-inputs.py

      - name: Validate umbrella manifest
        run: python scripts/release/validate-manifests.py --component loza

      - name: Check umbrella tag is available
        run: python scripts/release/tag-component.py loza --dry-run

      - name: Create umbrella tag
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(python scripts/release/tag-component.py loza --dry-run)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${tag}" -f "sha=${GITHUB_SHA}"

      - name: Create GitHub Release
        if: inputs.dry_run != true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${RELEASE_VERSION}" \
            release.yaml loza.yaml \
            --title "LOZA ${RELEASE_VERSION}" \
            --notes "Umbrella LOZA repository release ${RELEASE_VERSION}."
