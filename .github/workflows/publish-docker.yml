name: Publish Docker

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      version:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish:
    if: inputs.component == 'collector' || inputs.component == 'cortex'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      security-events: write
      actions: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - run: python -m pip install pyyaml

      - name: Validate workflow inputs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMPONENT: ${{ inputs.component }}
        run: python scripts/release/validate-inputs.py

      - name: Validate manifest
        env:
          RELEASE_COMPONENT: ${{ inputs.component }}
        run: python scripts/release/validate-manifests.py --component "$RELEASE_COMPONENT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ inputs.component }}/go.mod

      - name: Install protoc
        if: inputs.component == 'collector' || inputs.component == 'cortex'
        run: |
          PROTOC_VERSION=34.1
          PROTOC_SHA256=af27ea66cd26938fe48587804ca7d4817457a08350021a1c6e23a27ccc8c6904
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" -o /tmp/protoc.zip
          echo "${PROTOC_SHA256}  /tmp/protoc.zip" | sha256sum -c -
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          rm /tmp/protoc.zip

      - name: Install Go protoc plugins
        if: inputs.component == 'collector' || inputs.component == 'cortex'
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Generate protobuf code
        if: inputs.component == 'collector' || inputs.component == 'cortex'
        run: make proto

      - name: Run component tests
        run: go test ./...
        working-directory: ${{ inputs.component }}

      - name: Check component tag is available
        env:
          RELEASE_COMPONENT: ${{ inputs.component }}
        run: python scripts/release/tag-component.py "$RELEASE_COMPONENT" --dry-run

      - id: manifest
        name: Read Docker publish metadata
        shell: bash
        env:
          RELEASE_COMPONENT: ${{ inputs.component }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_GITHUB_REF: ${{ github.ref }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, yaml
          component = os.environ["RELEASE_COMPONENT"]
          registry = yaml.safe_load(open("release.yaml", encoding="utf-8"))["components"]
          manifest = yaml.safe_load(open(registry[component], encoding="utf-8"))
          docker = manifest["publish"]["docker"]
          paths = manifest.get("paths", {})
          version = os.environ["RELEASE_VERSION"]
          images = docker["images"]
          tags = []
          for image in images:
              tags.append(f"{image}:{version}")
              if os.environ["RELEASE_GITHUB_REF"] == "refs/heads/main" and os.environ["RELEASE_DRY_RUN"] != "true":
                  tags.append(f"{image}:latest")
          print("dockerfile=" + (paths.get("dockerfile") or docker.get("dockerfile")))
          print("context=" + docker.get("context", "."))
          print("primary_tag=" + tags[0])
          print("tags=" + ",".join(tags))
          PY

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        if: inputs.dry_run != true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ steps.manifest.outputs.context }}
          file: ${{ steps.manifest.outputs.dockerfile }}
          push: ${{ inputs.dry_run != true }}
          load: ${{ inputs.dry_run == true }}
          tags: ${{ steps.manifest.outputs.tags }}
          provenance: ${{ inputs.dry_run != true }}
          sbom: ${{ inputs.dry_run != true }}

      - name: Smoke test bundled LQL handshake
        if: inputs.component == 'collector'
        shell: bash
        env:
          IMAGE: ${{ steps.manifest.outputs.primary_tag }}
        run: |
          set -euo pipefail
          response="$(
            printf '%s\n' '{"id":1,"method":"handshake","protocol_version":1,"language_version":"0.1","params":{}}' |
              docker run --rm -i --entrypoint /usr/local/bin/lql "$IMAGE" serve --stdio
          )"
          LQL_HANDSHAKE="$response" python -c 'import json, os; result=json.loads(os.environ["LQL_HANDSHAKE"]); assert result["result"]["compiler_version"] == "0.5.1", result'
      - name: Scan image for vulnerabilities
        id: scan
        if: inputs.dry_run != true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.manifest.outputs.primary_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload vulnerability scan
        if: ${{ inputs.dry_run != true && always() && steps.scan.outcome != 'skipped' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-results.sarif

      - name: Install cosign
        if: inputs.dry_run != true
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2

      - name: Sign published image digest
        if: inputs.dry_run != true
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.manifest.outputs.tags }}
        run: |
          set -euo pipefail
          IFS=',' read -ra image_tags <<< "$TAGS"
          for tag in "${image_tags[@]}"; do
            image="${tag%%:*}"
            cosign sign --yes "${image}@${DIGEST}"
          done

      - name: Create component tag
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMPONENT: ${{ inputs.component }}
        run: |
          tag="$(python scripts/release/tag-component.py "$RELEASE_COMPONENT" --dry-run)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${tag}" -f "sha=${GITHUB_SHA}"
