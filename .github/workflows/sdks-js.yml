name: JS SDK CI

on:
  push:
    branches: [main]
    paths:
      - "sdks/js/**"
      - "clients/javascript/**"
      - "spec/**"
      - ".github/workflows/sdks-js.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdks/js/**"
      - "clients/javascript/**"
      - "spec/**"
      - ".github/workflows/sdks-js.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/js

    steps:
      - uses: 11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: 0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Tests
        run: bun run test


      - name: Coverage
        run: bun run coverage


      - uses: a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install conformance dependencies
        working-directory: .
        run: |
          pip install pytest
          pip install -e sdks/py

      - name: Run grouped conformance
        working-directory: spec
        run: python conformance/runner.py --sdk javascript --group all
  client:
    name: JavaScript LQL Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/javascript

    steps:
      - uses: 11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: 0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Tests
        run: bun run test

      - name: Coverage
        run: bun run coverage
