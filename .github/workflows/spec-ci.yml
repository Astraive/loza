name: Spec CI

on:
  push:
    branches: [main]
    paths:
      - "spec/**"
      - ".github/workflows/spec-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "spec/**"
      - ".github/workflows/spec-ci.yml"

permissions:
  contents: read

jobs:
  generation-check:
    name: Verify generated artifacts are up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check generated artifacts
        working-directory: spec
        run: python codegen/generate.py --check

  mirror-check:
    name: Verify mirror folders are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check mirror consistency
        working-directory: spec
        run: python scripts/check_mirrors.py

  contract-integrity-check:
    name: Verify spec contract refs, docs, and registry integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check spec contract
        working-directory: spec
        run: python scripts/check_spec_contract.py

  conformance-check:
    name: Verify grouped SDK conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: sdks/go/go.mod
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Check Go formatting
        run: bash scripts/fmt-check.sh
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install JavaScript SDK dependencies
        run: bun install --frozen-lockfile
        working-directory: sdks/js
      - name: Install conformance dependencies
        run: python -m pip install --upgrade pip jsonschema pytest
      - name: Install Python SDK
        run: pip install -e sdks/py
      - name: Check fixture conformance
        working-directory: spec
        run: python scripts/check_conformance.py
      - name: Run grouped SDK conformance
        working-directory: spec
        run: python conformance/runner.py --sdk all --group all

  release-protection:
    name: Protect release folder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Verify release folder structure
        working-directory: spec
        run: python scripts/check_releases.py
      - name: Check release folder changes (PR only)
        if: github.event_name == 'pull_request'
        working-directory: spec
        run: |
          echo "Checking for changes in releases/..."
          if git diff origin/main...HEAD -- releases/ | grep -q .; then
            echo "Changes detected in releases/"
            echo "Release snapshots are immutable. To modify:"
            echo "1. Update CHANGELOG.md with version notes"
            echo "2. Explain changes in commit message"
            echo "3. Request approval from maintainers"
            exit 1
          fi
          echo "releases/ unchanged"
