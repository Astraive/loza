name: OpenAPI generation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/openapi-gen.yml"
      - "tools/generate_openapi.sh"
      - "scripts/test_generate_openapi.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/openapi-gen.yml"
      - "tools/generate_openapi.sh"
      - "scripts/test_generate_openapi.py"

permissions:
  contents: read

jobs:
  validate:
    name: Validate OpenAPI generator entrypoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Test generator output contract
        run: python scripts/test_generate_openapi.py

  generate:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run OpenAPI generator script
        run: |
          chmod +x ./tools/generate_openapi.sh
          ./tools/generate_openapi.sh
      - name: Upload generated clients
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openapi-generated
          path: generated/openapi
