name: Release Detect

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Validate manifests and detect version bumps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install release tooling dependencies
        run: python -m pip install pyyaml

      - name: Validate release manifests
        run: python scripts/release/validate-manifests.py

      - name: Test release input validation
        run: python -m unittest discover -s scripts/release -p 'test_*.py' -v

      - id: base
        name: Resolve comparison base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "ref=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            echo "ref=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect manifest version increments
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: python scripts/release/changed-components.py --base-ref "$BASE_REF"
