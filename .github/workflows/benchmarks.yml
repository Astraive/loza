name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  duckdb-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: 11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: 40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: collector/go.mod
      - name: Install protoc
        run: |
          PROTOC_VERSION=34.1
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" -o /tmp/protoc.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          rm /tmp/protoc.zip
      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Generate protobuf code
        run: make proto
      - name: Run Go benchmarks
        run: |
          cd collector
          go test ./... -bench=. -benchmem | tee ../bench-results.txt
      - name: Upload bench results
        uses: ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-results
          path: bench-results.txt
