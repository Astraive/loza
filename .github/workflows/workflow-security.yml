name: Workflow Security

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/check-workflow-security.py"
      - "scripts/test_check_workflow_security.py"
      - "scripts/README.md"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/check-workflow-security.py"
      - "scripts/test_check_workflow_security.py"
      - "scripts/README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Enforce pinned actions and scoped permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python scripts/test_check_workflow_security.py -v
      - name: Check all workflows
        run: python scripts/check-workflow-security.py
