name: Rust SDK CI

on:
  push:
    branches: [main]
    paths:
      - "sdks/rs/**"
      - "spec/**"
      - ".github/workflows/sdks-rs.yml"
  pull_request:
    paths:
      - "sdks/rs/**"
      - "spec/**"
      - ".github/workflows/sdks-rs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rs
    needs: [lint]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Build
        run: cargo build --all-features

      - name: Tests (excl. collector_e2e)
        run: >
          cargo test --all-features
          --lib
          --test behavior
          --test api_behavior_test
          --test config_env
          --test dsn_test
          --test parity
          --test typed_attribute_helpers
          --test domain_helpers_test
          --test smoke
          --test e2e
          --test spec_contract_test
          --test conformance_fixtures
          --test ingest_envelope_fixture
          --test config_defaults
          --test incident_id_test
          --test client_creation
          --test sampling_policy
          --test state_machine
          --test emitted_shape_fixture
          --test alias_test
          --test sink_queue_flush_shutdown
          --test testing_conformance
          --test httpbatch_transport
          --test collector_cortex_conformance
          --test basic_logging_events
          --test collector_ack_fixture
          --test collector_api_cli
          --test identity_domain_helpers
          --test lifecycle_event
          --test process_group_timer_stopwatch

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.6.16 --locked

      - name: Coverage
        # Set below the measured suite baseline so coverage remains enforced.
        run: >
          cargo llvm-cov --all-features --all-targets
          --ignore-filename-regex 'coverage_tests\.rs$'
          --fail-under-lines 60
          --lcov --output-path lcov.info


  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/rs
    needs: [lint]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install conformance dependencies
        run: |
          pip install pytest
          pip install -e ../py

      - name: Conformance runner
        working-directory: spec
        run: python conformance/runner.py --sdk rust --group all

      - name: Spec contract tests
        run: cargo test --test spec_contract_test --test conformance_fixtures --test ingest_envelope_fixture
