name: Publish Rust

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      version:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish-sdk:
    if: inputs.component == 'sdk-rs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: sdks/rs
    steps:
      - uses: 11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: 39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install pyyaml
        working-directory: .
      - run: python scripts/release/validate-manifests.py --component sdk-rs
        working-directory: .
      - run: cargo test --all-features
      - run: cargo package
      - name: Check component tag is available
        run: python scripts/release/tag-component.py sdk-rs --dry-run
        working-directory: .

      - name: Authenticate with crates.io
        if: inputs.dry_run != true
        id: crates-auth
        uses: 3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1

      - name: Publish crate
        if: inputs.dry_run != true
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

      - name: Create component tag
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(python scripts/release/tag-component.py sdk-rs --dry-run)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${tag}" -f "sha=${GITHUB_SHA}"
        working-directory: .
