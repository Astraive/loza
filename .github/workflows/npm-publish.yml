name: Publish JS

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      version:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        required: false


permissions:
  contents: read

jobs:
  publish:
    if: inputs.component == 'sdk-js'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: sdks/js
    steps:
      - uses: 11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: 0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: 49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - uses: a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - run: python -m pip install pyyaml
        working-directory: .

      - run: python scripts/release/validate-manifests.py --component sdk-js
        working-directory: .

      - name: Enforce Bun package identity
        run: |
          test "$(bun -e "console.log((await Bun.file('package.json').json()).name)")" = "@astraive/loza"
          test "$(bun -e "console.log((await Bun.file('package.json').json()).version)")" = "${{ inputs.version }}"

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test

      - name: Check component tag is available
        run: python scripts/release/tag-component.py sdk-js --dry-run
        working-directory: .

      - name: Install OIDC-capable npm
        run: npm install --global npm@12.0.2

      - name: Publish package
        if: inputs.dry_run != true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Validate package archive
        if: inputs.dry_run == true
        run: npm pack --dry-run

      - name: Create component tag
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(python scripts/release/tag-component.py sdk-js --dry-run)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${tag}" -f "sha=${GITHUB_SHA}"
        working-directory: .
